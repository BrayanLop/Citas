services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: citas-postgres
    environment:
      POSTGRES_DB: citas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: e2GLOUYELM5kveUf
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - citas-network

  # API .NET
  api:
    build:
      context: .
      dockerfile: Citas/Dockerfile
    container_name: citas-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080;https://+:8443
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/app/https/aspnetapp.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=password123
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=citas;Username=postgres;Password=e2GLOUYELM5kveUf
      - Jwt__Issuer=CitasApi
      - Jwt__Audience=CitasApiClients
      - Jwt__Key=aC3xY9zK2mP5qL7wM0oR4sT6uV8xY9zK2mP5qL7wN0oR=
    ports:
      - "8080:8080"
      - "8443:8443"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - citas-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  citas-network:
    driver: bridge
