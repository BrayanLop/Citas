name: Pruebas

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Las pruebas de integración levantan un PostgreSQL desechable con Docker
      # (Testcontainers); el runner de GitHub ya trae Docker.
      - name: Pruebas (unitarias y de integración)
        run: dotnet test Citas.Tests/Citas.Tests.csproj --configuration Release
